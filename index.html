<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>খান সুপার শপ - অনলাইন মুদি বাজার</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
        }
        header {
            background-color: #2e7d32;
            color: white;
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo h1 {
            font-size: 24px;
            font-weight: bold;
        }
        .cart-icon-btn {
            background-color: #1b5e20;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .badge {
            background-color: #ff9100;
            color: white;
            padding: 2px 8px;
            border-radius: 50%;
            font-size: 14px;
        }
        .main-container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }
        @media (max-width: 768px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }
        .products-section h2 {
            margin-bottom: 20px;
            color: #2e7d32;
            border-bottom: 2px solid #2e7d32;
            padding-bottom: 5px;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }
        .product-card {
            background: white;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .product-card img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin: 0 auto 15px;
        }
        .product-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .product-price {
            color: #e65100;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 12px;
        }
        .add-to-cart-btn {
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: background 0.2s;
        }
        .add-to-cart-btn:hover {
            background-color: #1b5e20;
        }
        .sidebar-section {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            height: fit-content;
        }
        .sidebar-section h3 {
            margin-bottom: 15px;
            color: #2e7d32;
            border-bottom: 1px solid #ddd;
            padding-bottom: 8px;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px dashed #eee;
            font-size: 14px;
        }
        .cart-item-remove {
            color: #d32f2f;
            cursor: pointer;
            font-weight: bold;
            background: none;
            border: none;
            margin-left: 5px;
        }
        .cart-total {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            padding-top: 10px;
            border-top: 2px solid #ddd;
        }
        .checkout-form {
            margin-top: 25px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 14px;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        .whatsapp-order-btn {
            background-color: #25D366;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.2s;
        }
        .whatsapp-order-btn:hover {
            background-color: #1ebd54;
        }
        .empty-cart-msg {
            color: #777;
            text-align: center;
            padding: 20px 0;
        }
    </style>

    <!-- সুপাবেস কানেক্ট করার লাইব্রেরি (CDN) -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="logo">
                <h1> khan সুপার শপ 🛒</h1>
            </div>
            <div>
                <button class="cart-icon-btn">
                    কার্ট <span class="badge" id="cartCount">০</span>
                </button>
            </div>
        </div>
    </header>

    <div class="main-container">
        <!-- Products Grid Section -->
        <div class="products-section">
            <h2>আমাদের মুদি পণ্যসমূহ</h2>
            <div class="products-grid" id="productGrid">
                <!-- ডাটাবেস থেকে আসা পণ্য এখানে দেখাবে -->
            </div>
        </div>

        <!-- Sidebar Cart & Checkout Section -->
        <div class="sidebar-section">
            <h3>বাজারের থলি (Cart)</h3>
            <div id="cartItemsContainer">
                <p class="empty-cart-msg">আপনার থলি খালি আছে। পণ্য যোগ করুন।</p>
            </div>
            
            <div class="cart-total">
                <span>সর্বমোট:</span>
                <span><span id="cartTotalAmount">০</span> টাকা</span>
            </div>

            <!-- Checkout Form -->
            <div class="checkout-form">
                <h3>ডেলিভারি তথ্য</h3>
                <form id="orderForm">
                    <div class="form-group">
                        <label for="name">আপনার নাম *</label>
                        <input type="text" id="name" placeholder="যেমন: মো: রহিম" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">মোবাইল নাম্বার *</label>
                        <input type="tel" id="phone" placeholder="যেমন: 017XXXXXXXX" required>
                    </div>
                    <div class="form-group">
                        <label for="address">পূর্ণাঙ্গ ঠিকানা *</label>
                        <textarea id="address" rows="3" placeholder="গ্রাম/রোড, থানা, জেলা উল্লেখ করুন" required></textarea>
                    </div>
                    <button type="submit" class="whatsapp-order-btn">
                        🟢 হোয়াটসঅ্যাপে অর্ডার করুন
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // আপনার সুপাবেস প্রজেক্টের সঠিক তথ্য এখানে দিন
        const SUPABASE_URL = "https://atihyfukytqfvlzkwkpa.supabase.co"; 
        const SUPABASE_ANON_KEY = "sb_publishable_7U9jd7NsYONos-EKa05NJg_CTl4-4ZE"; // ড্যাশবোর্ড থেকে anon public কী-টি এখানে বসান
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let cart = []; 
        let allProducts = []; 

        async function loadProducts() {
            const productGrid = document.getElementById('productGrid');
            productGrid.innerHTML = '<p style="grid-column: 1/-1; text-align:center;">পণ্য লোড হচ্ছে...</p>';

            const { data: products, error } = await supabase
                .from('products')
                .select('*');

            if (error) {
                console.error("ডাটা আনতে সমস্যা হয়েছে:", error.message);
                productGrid.innerHTML = `<p style="grid-column: 1/-1; color:red; text-align:center;">পণ্য লোড করা যায়নি! এরর: ${error.message}</p>`;
                return;
            }

            allProducts = products; 
            productGrid.innerHTML = ''; 

            if(products.length === 0) {
                productGrid.innerHTML = '<p style="grid-column: 1/-1; text-align:center;">কোনো পণ্য পাওয়া যায়নি।</p>';
                return;
            }

            products.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <img src="${product.image_url || 'https://placeholder.com'}" alt="${product.name}">
                    <div class="product-title">${product.name}</div>
                    <div class="product-price">${product.price} টাকা</div>
                    <button class="add-to-cart-btn" onclick="addToCart(${product.id})">কার্টে যোগ করুন</button>
                `;
