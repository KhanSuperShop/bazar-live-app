<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>খান সুপার শপ - হোম পেজ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- হেডার বা নেভিগেশন বার -->
    <header>
        <div class="class="logo"">খান সুপার শপ</div>
    </header>

    <main>
        <!-- মেইন লেআউট বক্স শুরু (যা পণ্য এবং কার্টকে পাশাপাশি রাখবে) -->
        <div class="main-layout">

            <!-- বাম পাশের পণ্যের অংশ -->
            <div class="products-container">
                <h2>আমাদের পণ্যসমূহ</h2>
                
                <!-- সুপা-বেস থেকে প্রোডাক্ট লোড হওয়ার গ্রিড -->
                <div id="product-container" class="product-grid">
                    <p class="loading">পণ্য লোড হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...</p>
                </div>
            </div>

            <!-- ডান পাশের কার্ট ও ডেলিভারি ফর্মের অংশ -->
            <div class="cart-container">
                <h2>বাজারের থলি (Cart)</h2>
                <p id="cart-status">আপনার থলি খালি আছে। পণ্য যোগ করুন।</p>
                
                <div class="total-amount">
                    <strong>সর্বমোট:</strong> <span id="total-price">০</span> টাকা
                </div>

                <h3>ডেলিভারি তথ্য</h3>
                <form id="delivery-form">
                    <label>আপনার নাম *</label>
                    <input type="text" id="user-name" placeholder="যেমন: মো: রহিম" required>

                    <label>মোবাইল নাম্বার *</label>
                    <input type="text" id="user-phone" placeholder="যেমন: 017XXXXXXXX" required>

                    <label>পূর্ণাঙ্গ ঠিকানা *</label>
                    <textarea id="user-address" placeholder="গ্রাম/রোড, থানা, জেলা উল্লেখ করুন" required></textarea>
                    
                    <button type="submit" class="submit-btn">অর্ডার সম্পন্ন করুন</button>
                </form>
            </div>

        </div> <!-- মেইন লেআউট বক্স শেষ -->
    </main>

    <!-- আপনার জাভাস্ক্রিপ্ট ফাইলগুলোর লিঙ্ক (নিশ্চিত করুন এগুলো নিচে আছে) -->
    <script src="supabase.js"></script>
    <script src="index.js"></script>
</body>
</html>
