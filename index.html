<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>খান সুপার শপ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #f4f6f9; color: #333; }
        header { background-color: #27ae60; color: white; text-align: center; padding: 20px; font-size: 26px; font-weight: bold; }
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 25px; }
        .product-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.05); text-align: center; padding: 15px; border: 1px solid #eee; position: relative; }
        .product-card img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; }
        .category-badge { position: absolute; top: 10px; right: 10px; background: #27ae60; color: white; padding: 4px 8px; font-size: 12px; border-radius: 20px; text-transform: uppercase; }
        .product-title { font-size: 18px; font-weight: bold; margin: 15px 0 5px 0; }
        .product-price { color: #e74c3c; font-size: 18px; font-weight: bold; margin-bottom: 15px; }
        .buy-btn { background-color: #e67e22; color: white; padding: 10px; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; }
        .buy-btn:hover { background-color: #d35400; }
        .loading { text-align: center; font-size: 18px; color: #777; grid-column: 1 / -1; padding: 40px; }
    </style>
</head>
<body>

    <header>🏪 খান সুপার শপ</header>

    <div class="container">
        <h2>🛍️ আমাদের পণ্যসমূহ</h2>
        <br>
        <div class="product-grid" id="productContainer">
            <div class="loading">পণ্য লোড হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...</div>
        </div>
    </div>

    <script>
        // আপনার গুগল শিটের লাইভ সিএসভি লিঙ্ক
        const googleSheetCsvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQjejo64MjLtJYqSmMnfKGpG4uVb45SQsxOc5RfSncEnR811rZFNfFnlR2B99M5ysriDO8RdvkBYTMl/pub?output=csv
';

        async function fetchProducts() {
            try {
                const response = await fetch(googleSheetCsvUrl);
                const data = await response.text();
                
                // লাইন ব্রেক হ্যান্ডেল করার জন্য সঠিক রেজেক্স (Regex) ব্যবহার
                const rows = data.split(/\r?\n/).slice(1); 
                const container = document.getElementById('productContainer');
                container.innerHTML = ''; 

                rows.forEach(row => {
                    // কমা দিয়ে আলাদা করা, তবে কোটেশনের ভেতরের কমা এড়ানোর জন্য রেজেক্স
                    const columns = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    
                    if (columns.length >= 4 && columns[0].trim() !== '') {
                        const name = columns[0].replace(/"/g, '').trim();
                        const price = columns[1].replace(/"/g, '').trim();
                        const imgUrl = columns[2].replace(/"/g, '').trim();
                        const category = columns[3].replace(/"/g, '').trim();

                        const card = document.createElement('div');
                        card.className = 'product-card';
                        card.innerHTML = `
                            <span class="category-badge">${category}</span>
                            <img src="${imgUrl}" alt="${name}" onerror="this.src='https://placeholder.com'">
                            <div class="product-title">${name}</div>
                            <div class="product-price">${price} ৳</div>
                            <button class="buy-btn">অর্ডার করুন</button>
                        `;
                        container.appendChild(card);
                    }
                });
            } catch (error) {
                console.error(error);
                document.getElementById('productContainer').innerHTML = '<div class="loading" style="color:red;">পণ্য লোড করা যায়নি! গুগল শিটের শেয়ার সেটিংস চেক করুন।</div>';
            }
        }

        fetchProducts();
    </script>
</body>
</html>
