<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>খান সুপার শপ - অনলাইন মুদি বাজার</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
        }
        header {
            background-color: #2e7d32;
            color: white;
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo h1 {
            font-size: 24px;
            font-weight: bold;
        }
        .cart-icon-btn {
            background-color: #1b5e20;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .badge {
            background-color: #ff9100;
            color: white;
            padding: 2px 8px;
            border-radius: 50%;
            font-size: 14px;
        }
        .main-container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }
        @media (max-width: 768px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }
        .products-section h2 {
            margin-bottom: 20px;
            color: #2e7d32;
            border-bottom: 2px solid #2e7d32;
            padding-bottom: 5px;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }
        .product-card {
            background: white;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .product-card img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin: 0 auto 15px;
        }
        .product-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .product-price {
            color: #e65100;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 12px;
        }
        .add-to-cart-btn {
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: background 0.2s;
        }
        .add-to-cart-btn:hover {
            background-color: #1b5e20;
        }
        .sidebar-section {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            height: fit-content;
        }
        .sidebar-section h3 {
            margin-bottom: 15px;
            color: #2e7d32;
            border-bottom: 1px solid #ddd;
            padding-bottom: 8px;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px dashed #eee;
            font-size: 14px;
        }
        .cart-item-remove {
            color: #d32f2f;
            cursor: pointer;
            font-weight: bold;
            background: none;
            border: none;
            margin-left: 5px;
        }
        .cart-total {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            padding-top: 10px;
            border-top: 2px solid #ddd;
        }
        .checkout-form {
            margin-top: 25px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 14px;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        .whatsapp-order-btn {
            background-color: #25D366;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.2s;
        }
        .whatsapp-order-btn:hover {
            background-color: #1ebd54;
        }
        .empty-cart-msg {
            color: #777;
            text-align: center;
            padding: 20px 0;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="logo">
                <h1> khan সুুপার শপ 🛒</h1>
            </div>
            <div>
                <button class="cart-icon-btn">
                    কার্ট <span class="badge" id="cartCount">০</span>
                </button>
            </div>
        </div>
    </header>

    <div class="main-container">
        <!-- Products Grid Section -->
        <div class="products-section">
            <h2>আমাদের মুদি পণ্যসমূহ</h2>
      <div class="products-grid" id="productsContainer"></div>
<div class="product-card">
                    <img src="https://cdn-icons-png.flaticon.com/512/5029/5029236.png" alt="মিনিকেট চাল">
                    <div>
                        <div class="product-title">মিনিকেট চাল (১ কেজি)</div>
                        <div class="product-price">৭০ টাকা</div>
                    </div>
                    <button class="add-to-cart-btn" onclick="addToCart('মিনিকেট চাল', 70)">কার্টে যোগ করুন</button>
                </div>
 <div class="product-card">
                    <img src="https://cdn-icons-png.flaticon.com/512/7250/7250811.png" alt="মসুর ডাল">
                    <div>
                        <div class="product-title">মসুর ডাল (১ কেজি)</div>
                        <div class="product-price">১৩০ টাকা</div>
                    </div>
                    <button class="add-to-cart-btn" onclick="addToCart('মসুর ডাল', 130)">কার্টে যোগ করুন</button>
                </div>

                
               
        <!-- Sidebar Cart & Checkout Section -->
        <div class="sidebar-section">
            <h3>বাজারের থলি (Cart)</h3>
            <div id="cartItemsContainer">
                <p class="empty-cart-msg">আপনার থলি খালি আছে। পণ্য যোগ করুন।</p>
            </div>
            
            <div class="cart-total">
                <span>সর্বমোট:</span>
                <span><span id="cartTotalAmount">০</span> টাকা</span>
            </div>

            <!-- Checkout Form -->
            <div class="checkout-form">
                <h3>ডেলিভারি তথ্য</h3>
                <form id="orderForm" onsubmit="checkoutToWhatsApp(event)">
                    <div class="form-group">
                        <label for="name">আপনার নাম *</label>
                        <input type="text" id="name" required placeholder="যেমন: মো: রহিম">
                    </div>
                    <div class="form-group">
                        <label for="phone">মোবাইল নাম্বার *</label>
                        <input type="tel" id="phone" required placeholder="যেমন: 017XXXXXXXX">
                    </div>
                    <div class="form-group">
                        <label for="address">পূর্ণাঙ্গ ঠিকানা *</label>
                        <textarea id="address" rows="3" required placeholder="গ্রাম/রোড, থানা, জেলা উল্লেখ করুন"></textarea>
                    </div>
                    <button type="submit" class="whatsapp-order-btn">
                        🟢 হোয়াটসঅ্যাপে অর্ডার করুন
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // কার্ট ডাটাবেজ
        let cart = [];

        // কার্টে পণ্য যোগ করার ফাংশন
        function addToCart(name, price) {
            // চেক করা হচ্ছে পণ্যটি অলরেডি কার্টে আছে কিনা
            const existingItem = cart.find(item => item.name === name);
            
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ name: name, price: price, quantity: 1 });
            }
            
            updateCartUI();
        }

        // কার্ট থেকে আইটেম রিমুভ করার ফাংশন
        function removeFromCart(name) {
            cart = cart.filter(item => item.name !== name);
            updateCartUI();
        }

        // কার্ট ইন্টারফেস আপডেট করার ফাংশন// কার্ট ইন্টারফেস আপডেট করার ফাংশন
function updateCartUI() {
    const cartItemsContainer = document.getElementById('cartItemsContainer');
    const cartCount = document.getElementById('cartCount');
    const cartTotalAmount = document.getElementById('cartTotalAmount');

    if (cart.length === 0) {
        cartItemsContainer.innerHTML = '<p class="empty-cart-msg">আপনার থলি খালি আছে। পণ্য যোগ করুন</p>';
        cartCount.innerText = '০';
        cartTotalAmount.innerText = '০';
        return;
    }

    let totalItems = 0;
    let totalPrice = 0;
    let html = '';

    cart.forEach((item, index) => {
        const itemTotal = item.price * item.quantity;
        totalPrice += itemTotal;
        totalItems += item.quantity;

        html += `
            <div class="cart-item" style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee;">
                <div style="display: flex; align-items: center; gap: 15px;">
                    <strong>${item.name}</strong>
                    
                    <!-- প্লাস-মাইনাস বাটনের নতুন অংশ -->
                    <div style="display: inline-flex; align-items: center; gap: 5px;">
                        <button onclick="decreaseQuantity(${index})" style="background-color: #e53935; color: white; border: none; width: 24px; height: 24px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center;">-</button>
                        <span style="font-weight: bold; min-width: 20px; text-align: center; color: #2e7d32;">${item.quantity}</span>
                        <button onclick="increaseQuantity(${index})" style="background-color: #4caf50; color: white; border: none; width: 24px; height: 24px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center;">+</button>
                    </div>
                </div>
                <div style="text-align: right; display: flex; align-items: center; gap: 15px;">
                    <span>${itemTotal} টাকা</span>
                    <button class="cart-item-remove" onclick="removeFromCart('${item.name}')" style="background: none; border: none; color: #ff0000; font-weight: bold; cursor: pointer; font-size: 16px;">X</button>
                </div>
            </div>
        `;
    });

    cartItemsContainer.innerHTML = html;
    cartCount.innerText = totalItems;
    cartTotalAmount.innerText = totalPrice;
}

// প্লাস (+) বাটনে ক্লিক করলে পরিমাণ বাড়ানোর ফাংশন
function increaseQuantity(index) {
    cart[index].quantity += 1;
    updateCartUI();
}

// মাইনাস (-) বাটনে ক্লিক করলে পরিমাণ কমানোর ফাংশন
function decreaseQuantity(index) {
    if (cart[index].quantity > 1) {
        cart[index].quantity -= 1;
    } else {
        // ১ এর কম হলে কার্ট থেকে পণ্যটি স্বয়ংক্রিয়ভাবে মুছে যাবে
        cart.splice(index, 1);
    }
    updateCartUI();
}

        // হোয়াটসঅ্যাপে অর্ডার পাঠানোর মূল ফাংশন
        function checkoutToWhatsApp(event) {
            event.preventDefault(); // পেজ রিলোড বন্ধ করা

            if (cart.length === 0) {
                alert("আপনার কার্ট খালি! অনুগ্রহ করে পণ্য যোগ করুন।");
                return;
            }

            // কাস্টমার ইনফো
            const customerName = document.getElementById('name').value;
            const customerPhone = document.getElementById('phone').value;
            const customerAddress = document.getElementById('address').value;
            const totalAmount = document.getElementById('cartTotalAmount').innerText;

            // পণ্যের তালিকা মেসেজ ফরম্যাটে রূপান্তর করা
            let productListMessage = '';
            cart.forEach((item, index) => {
                productListMessage += `${index + 1}. ${item.name} - ${item.quantity}টি = ${item.price * item.quantity} টাকা\n`;
            });

            // আপনার সঠিক হোয়াটসঅ্যাপ নাম্বার (৮৮ সহ)
            const whatsappNumber = "8801749672230";

            // মেসেজ টেমপ্লেট মেকিং
            const orderMessage = `*🛍️ নতুন অর্ডার - খান সুপার শপ*\n` +
                                 `-----------------------------------------\n` +
                                 `*কাস্টমার প্রোফাইল:*\n` +
                                 `👤 নাম: ${customerName}\n` +
                                 `📞 মোবাইল: ${customerPhone}\n` +
                                 `📍 ঠিকানা: ${customerAddress}\n` +
                                 `-----------------------------------------\n` +
                                 `*অর্ডারকৃত পণ্যের তালিকা:*\n${productListMessage}` +
                                 `-----------------------------------------\n` +
                                 `*💵 সর্বমোট প্রদেয় বিল:* ${totalAmount} টাকা\n` +
                                 `-----------------------------------------\n` +
                                 `অর্ডারটি দ্রুত নিশ্চিত করুন। ধন্যবাদ!`;

            // হোয়াটসঅ্যাপ লিংক জেনারেট এবং ওপেন করা
            const encodedMessage = encodeURIComponent(orderMessage);
            const finalWhatsAppUrl = `https://wa.me/${whatsappNumber}?text=${encodedMessage}`;

            // নতুন ট্যাবে লিংকটি ওপেন করবে
            window.open(finalWhatsAppUrl, '_blank');
        }
    </script>
<div style="text-align: center; padding: 20px; background: #eee; margin-top: 50px;">
    <a href="admin.html" style="color: #2e7d32; text-decoration: none; font-weight: bold;">অ্যাডমিন লগইন</a>
</div>
<script src="https://jsdelivr.net"></script>
<script src="supabase-bazar.js"></script>

</body>
</html>
