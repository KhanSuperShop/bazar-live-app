<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>খান সুপার শপ - অনলাইন মুদি বাজার</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
        }
        header {
            background-color: #2e7d32;
            color: white;
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo h1 {
            font-size: 24px;
            font-weight: bold;
        }
        .cart-icon-btn {
            background-color: #1b5e20;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .badge {
            background-color: #ff9100;
            color: white;
            padding: 2px 8px;
            border-radius: 50%;
            font-size: 14px;
        }
        .main-container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }
        @media (max-width: 768px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }
        .products-section h2 {
            margin-bottom: 20px;
            color: #2e7d32;
            border-bottom: 2px solid #2e7d32;
            padding-bottom: 5px;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }
        .product-card {
            background: white;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
        }
        .product-card img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin: 0 auto 15px;
        }
        .product-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .product-price {
            color: #e65100;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 12px;
        }
        .add-to-cart-btn {
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: background 0.2s;
        }
        .add-to-cart-btn:hover {
            background-color: #1b5e20;
        }
        .sidebar-section {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            height: fit-content;
        }
        .sidebar-section h3 {
            margin-bottom: 15px;
            color: #2e7d32;
            border-bottom: 1px solid #ddd;
            padding-bottom: 8px;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px dashed #eee;
            font-size: 14px;
        }
        .cart-item-remove {
            color: #d32f2f;
            cursor: pointer;
            font-weight: bold;
            background: none;
            border: none;
            margin-left: 5px;
        }
        .cart-total {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            padding-top: 10px;
            border-top: 2px solid #ddd;
        }
        .checkout-form {
            margin-top: 25px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 14px;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        .whatsapp-order-btn {
            background-color: #25D366;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.2s;
        }
        .whatsapp-order-btn:hover {
            background-color: #1ebd54;
        }
        .empty-cart-msg {
            color: #777;
            text-align: center;
            padding: 20px 0;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="logo">
                <h1> khan সুপার শপ 🛒</h1>
            </div>
            <div>
                <button class="cart-icon-btn">
                    কার্ট <span class="badge" id="cartCount">০</span>
                </button>
            </div>
        </div>
    </header>

    <div class="main-container">
        <!-- Products Grid Section -->
        <div class="products-section">
            <h2>আমাদের মুদি পণ্যসমূহ</h2>
            <div class="products-grid" id="productsGrid">
                <!-- গুগল শিটের পণ্যগুলো অটোমেটিক এখানে চলে আসবে -->
                <p style="text-align: center; padding: 20px; color: #777;">পণ্য লোড হচ্ছে...</p>
            </div>
        </div>

        <!-- Shopping Cart / Checkout Sidebar Section -->
        <div class="sidebar-section">
            <h3>বাজারের থলি (Cart)</h3>
            <div id="cartItemsContainer">
                <p class="empty-cart-msg">আপনার থলি খালি আছে! পণ্য যোগ করুন।</p>
            </div>
            
            <div class="cart-total">
                <span>সর্বমোট:</span>
                <span><span id="cartTotalAmount">০</span> টাকা</span>
            </div>

            <!-- Checkout Form -->
            <form class="checkout-form" id="orderForm" onsubmit="sendOrder(event)">
                <div class="form-group">
                    <label for="customerName">আপনার নাম *</label>
                    <input type="text" id="customerName" placeholder="যেমন: মোঃ রহিম" required>
                </div>
                <div class="form-group">
                    <label for="customerPhone">মোবাইল নাম্বার *</label>
                    <input type="tel" id="customerPhone" placeholder="যেমন: 017XXXXXXXX" required>
                </div>
                <div class="form-group">
                    <label for="customerAddress">পূর্ণাঙ্গ ঠিকানা *</label>
                    <textarea id="customerAddress" rows="3" placeholder="গ্রাম/রোড, থানা, জেলা উল্লেখ করুন" required></textarea>
                </div>
                <button type="submit" class="whatsapp-order-btn">
                    💬 হোয়াটসঅ্যাপে অর্ডার করুন
                </button>
            </form>
        </div>
    </div>

<script>
// ১. আপনার তৈরি করা গুগল ওয়েব অ্যাপ লিংক
const sheetDbUrl = "https://google.com";

// গ্লোবাল কার্ট ভ্যারিয়েবল
let cart = [];

// ২. গুগল শিট থেকে পণ্য লোড করার ফাংশন
async function loadProductsFromSheet() {
    try {
        const response = await fetch(sheetDbUrl);
        const products = await response.json();
        
        const container = document.getElementById('productsGrid');
        if (!container) return;

        container.innerHTML = ""; // ডামি লোডিং মেসেজ মুছে ফেলা

        products.forEach(product => {
            // দাম সংখ্যায় রূপান্তর
            const priceNum = parseInt(product.price) || 0;
            
            container.innerHTML += `
                <div class="product-card">
                    <img src="${product.image}" alt="${product.name}">
                    <div>
                        <div class="product-title">${product.name}</div>
                        <div class="product-price">${priceNum} টাকা</div>
                    </div>
                    <button class="add-to-cart-btn" onclick="addToCart('${product.name}', ${priceNum})">কার্টে যোগ করুন</button>
                </div>
            `;
        });
    } catch (error) {
        console.error("গুগল শিট থেকে ডাটা লোড করতে সমস্যা হয়েছে:", error);
        document.getElementById('productsGrid').innerHTML = '<p style="color:red; text-align:center;">পণ্য লোড করতে ব্যর্থ হয়েছে!</p>';
    }
}

// ৩. কার্টে পণ্য যোগ করার ফাংশন
function addToCart(name, price) {
    const existingItem = cart.find(item => item.name === name);
    if (existingItem) {
        existingItem.quantity += 1;
    } else {
        cart.push({ name: name, price: price, quantity: 1 });
    }
    updateCartUI();
}

// ৪. কার্ট থেকে পণ্য কমানো বা মোছার ফাংশন
function removeFromCart(name) {
    cart = cart.filter(item => item.name !== name);
