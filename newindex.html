<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>খান সুপার শপ</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f4f4; color: #333; }
        header { text-align: center; background: #28a745; color: white; padding: 15px; margin-bottom: 20px; border-radius: 5px; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; margin-top: 20px; }
        .product-card { border: 1px solid #ddd; padding: 12px; border-radius: 5px; text-align: center; background: #fafafa; display: flex; flex-direction: column; justify-content: space-between; }
        .product-card img { width: 80px; height: 80px; object-fit: contain; margin: 10px auto; display: block; }
        .product-card h3 { margin: 10px 0 5px 0; font-size: 16px; text-transform: capitalize; }
        .product-card p { color: #28a745; font-weight: bold; margin: 0 0 10px 0; font-size: 16px; }
        .order-btn { background: #25D366; color: white; padding: 8px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold; text-decoration: none; display: block; }
        .order-btn:hover { background: #128C7E; }
    </style>
</head>
<body>

    <header>
        <h1>খান সুপার শপ</h1>
        <p>আপনার নিত্যদিনের প্রয়োজনীয় মুদি দোকান</p>
    </header>

    <div class="container">
        <h2>🛒 আমাদের পণ্যসমূহ</h2>
        <div class="product-grid" id="productGrid"></div>
    </div>

    <script>
        // আপনার নিজের হোয়াটসঅ্যাপ নম্বরটি এখানে বসান
        const WHATSAPP_NUMBER = "8801749672230"; 

        function renderProducts() {
            const grid = document.getElementById('productGrid');
            const localItems = JSON.parse(localStorage.getItem('khan_shop_perfect_data')) || [];

            if (localItems.length === 0) {
                grid.innerHTML = '<p>দোকানে বর্তমানে কোনো পণ্য নেই।</p>';
                return;
            }

            grid.innerHTML = '';
            localItems.forEach(product => {
                const defaultBox = 'https://flaticon.com';
                const msg = encodeURIComponent(`হ্যালো খান সুপার শপ, আমি এই পণ্যটি অর্ডার করতে চাই:\n\nপণ্যের নাম: ${product.name}\nমূল্য: ৳ ${product.price}`);
                
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div>
                        <img src="${product.image_url ? product.image_url : defaultBox}" onerror="this.src='${defaultBox}'">
                        <h3>${product.name}</h3>
                        <p>৳ ${product.price}</p>
                    </div>
                    <a href="https://wa.me{WHATSAPP_NUMBER}?text=${msg}" target="_blank" class="order-btn">💬 অর্ডার করুন</a>
                `;
                grid.appendChild(card);
            });
        }

        renderProducts();
        window.addEventListener('storage', renderProducts);
    </script>
</body>
</html>
