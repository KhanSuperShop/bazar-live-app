<!DOCTYPE html>
<html lang="bn">
<head>
    <!-- সুপাবেস কানেকশন লিংক (সংশোধিত) -->
    <script src="https://jsdelivr.net"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>খান সুপার শপ - অ্যাডমিন প্যানেল</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
        }
        /* সাইডবার ডিজাইন */
        .sidebar {
            width: 260px;
            background-color: #1b5e20;
            color: white;
            min-height: 100vh;
            padding: 20px;
            position: fixed;
        }
        .sidebar h2 {
            font-size: 20px;
            margin-bottom: 30px;
            text-align: center;
            border-bottom: 2px solid #2e7d32;
            padding-bottom: 10px;
        }
        .sidebar a {
            display: block;
            color: #e8f5e9;
            text-decoration: none;
            padding: 12px 15px;
            border-radius: 4px;
            margin-bottom: 10px;
            font-weight: 600;
            transition: 0.3s;
        }
        .sidebar a.active, .sidebar a:hover {
            background-color: #2e7d32;
            color: white;
        }
        /* মেইন কন্টেন্ট এরিয়া */
        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 40px;
        }
        .header-title {
            color: #1b5e20;
            margin-bottom: 25px;
            border-bottom: 2px solid #1b5e20;
            padding-bottom: 5px;
        }
        /* ফরম এবং টেবিল গ্রিড */
        .admin-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
        }
        @media (max-width: 992px) {
            .admin-grid { grid-template-columns: 1fr; }
        }
        /*カードデザイン*/
        .card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            height: fit-content;
        }
        .card h3 {
            margin-bottom: 15px;
            color: #2e7d32;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        .btn-submit {
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-submit:hover { background-color: #1b5e20; }
        /* টেবিল ডিজাইন */
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #2e7d32;
            color: white;
        }
        .btn-delete {
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-delete:hover { background-color: #b71c1c; }
    </style>
</head>
<body>

    <!-- সাইডবার নেভিগেশন -->
    <div class="sidebar">
        <h2>خان সুপার শপ 🛒</h2>
        <a href="#" class="active">📦 পণ্য ম্যানেজমেন্ট</a>
        <a href="#">📋 অর্ডার লিস্ট</a>
        <a href="#">👥 কাস্টমারস</a>
        <a href="index.html" style="margin-top: 50px; background-color: #c62828; text-align: center;">🏠 মেইন ওয়েবসাইটে যান</a>
    </div>

    <!-- মেইন কন্টেন্ট -->
    <div class="main-content">
        <h2 class="header-title">ড্যাশবোর্ড / পণ্য ম্যানেজমেন্ট</h2>
        
        <div class="admin-grid">
            <!-- নতুন পণ্য যোগ করার ফরম -->
            <div class="card">
                <h3>নতুন পণ্য যোগ করুন</h3>
                <form id="addProductForm">
                    <div class="form-group">
                        <label for="pName">পণ্যের নাম *</label>
                        <input type="text" id="pName" placeholder="উদা: দেশী পেঁয়াজ (১ কেজি)" required>
                    </div>
                    <div class="form-group">
                        <label for="pPrice">মূল্য (টাকা) *</label>
                        <input type="number" id="pPrice" placeholder="উদা: ৯৫" required>
                    </div>
                    <div class="form-group">
                        <label for="pImg">ছবির লিংক (ঐচ্ছিক)</label>
                        <input type="url" id="pImg" placeholder="https://example.com">
                    </div>
                    <button type="submit" class="btn-submit">পণ্য যুক্ত করুন</button>
                </form>
            </div>

            <!-- বর্তমান পণ্যের তালিকা -->
            <div class="card">
                <h3>বর্তমান পণ্যের তালিকা</h3>
                <div style="overflow-x: auto; margin-top: 15px;">
                    <table>
                        <thead>
                            <tr>
                                <th>ছবি</th>
                                <th>পণ্যের নাম</th>
                                <th>মূল্য</th>
                                <th>অ্যাকশন</th>
                            </tr>
                        </thead>
                        <tbody id="adminProductTable">
                            <!-- জাভাস্ক্রিপ্ট দিয়ে এখানে পণ্য লাইভ লোড হবে -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // আপনার সিকিউরিটি পাসওয়ার্ড প্রোম্পট
        (function() {
            let password = prompt("خان সুপার শপ - অ্যাডমিন প্যানেলে ঢুকতে সিকিউরিটি পাসওয়ার্ড দিন:");
            if (password !== "khan1234") { 
                alert("❌ ভুল পাসওয়ার্ড! আপনাকে মেইন কাস্টমার পেজে ফেরত পাঠানো হচ্ছে।");
                window.location.href = "index.html"; 
            } else {
                alert("✅ সফলভাবে লগইন হয়েছে! স্বাগতম অ্যাডমিন প্যানেলে।");
            }
        })();

        // সুপাবেস সেটিংস ও কানেকশন
        const SUPABASE_URL = "https://supabase.co";
        const SUPABASE_KEY = "sb_publishable_7U9jd7NsYoNos-EKn3yR9f4fqtK";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const defaultImage = 'https://flaticon.com';

        // ডাটাবেজ থেকে পণ্য এনে অ্যাডমিন টেবিলে দেখানোর ফাংশন
        async function renderAdminTable() {
            const tableBody = document.getElementById('adminProductTable');
            tableBody.innerHTML = '<tr><td colspan="4" style="text-align:center;">লোড হচ্ছে...</td></tr>';

            const { data: products, error } = await _supabase
                .from('products')
                .select('*');

            if (error) {
                console.error("ডাটা আনতে সমস্যা:", error);
                tableBody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:red;">ডাটা আনতে সমস্যা হয়েছে!</td></tr>';
                return;
            }

            let html = '';
            if (products.length === 0) {
                html = '<tr><td colspan="4" style="text-align:center;">কোনো পণ্য পাওয়া যায়নি।</td></tr>';
            } else {
                products.forEach((product) => {
                    const productImg = product.image_url ? product.image_url : defaultImage;
                    html += `
                        <tr>
                            <td><img src="${productImg}" width="35" height="35" style="object-fit:contain; border-radius:4px;"></td>
                            <td><strong>${product.name}</strong></td>
                            <td>${product.price} টাকা</td>
                            <td><button class="btn-delete" onclick="deleteProduct(${product.id})">মুছুন</button></td>
                        </tr>
                    `;
                });
            }
            tableBody.innerHTML = html;
        }

        // নতুন পণ্য ডাটাবেজে যোগ করার ফাংশন
        document.getElementById('addProductForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const name = document.getElementById('pName').value;
            const price = document.getElementById('pPrice').value;
            const img = document.getElementById('pImg').value || null;

            const { data, error } = await _supabase
                .from('products')
                .insert([{ name: name, price: parseInt(price), image_url: img }]);

            if (error) {
                alert('পণ্য যোগ করতে সমস্যা হয়েছে: ' + error.message);
            } else {
                alert('✅ পণ্য সফলভাবে ডাটাবেজে লাইভ যুক্ত হয়েছে!');
                document.getElementById('addProductForm').reset();
                renderAdminTable(); // টেবিল রিফ্রেশ করা
            }
        });

        // পণ্য ডাটাবেজ থেকে মুছে ফেলার ফাংশন
        async function deleteProduct(productId) {
            if (confirm("আপনি কি নিশ্চিতভাবে এই পণ্যটি মুছে ফেলতে চান?")) {
                const { error } = await _supabase
                    .from('products')
                    .delete()
                    .eq('id', productId);

                if (error) {
                    alert("মুছে ফেলতে সমস্যা হয়েছে: " + error.message);
                } else {
